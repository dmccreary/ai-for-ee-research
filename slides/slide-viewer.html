<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide Viewer</title>
<!--
  Slide viewer: shows ONE slide at a time from a plain markdown deck, so a deck
  with many MicroSim iframes only ever has the current slide's iframes alive.

  Usage (path is relative to this file, which lives in docs/slides/):
    slide-viewer.html?input=overview-microsims/slides.md
    slide-viewer.html?input=overview-microsims/slides.md#slide-5   (deep link)

  Slide format: slides are separated by a line containing only `---`
  (outside code fences). If a deck has no `---` separators, it is split on
  `## ` headings instead. Optional YAML frontmatter at the top is skipped;
  its `title:` is used as the deck title.

  Keys: Right/PageDown/Space = next, Left/PageUp = previous, Home/End,
        C = contents, F = fullscreen, Esc = close contents.

  The markdown is fetched same-origin only. MkDocs does not publish raw .md
  files, so plugins/copy_slide_sources.py copies docs/slides/**/*.md into the
  built site.
-->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #14182b;
    --panel: #1c2140;
    --panel-border: rgba(255, 255, 255, 0.1);
    --text: #e8e8e8;
    --muted: #90a4ae;
    --h1: #64b5f6;
    --h2: #81c784;
    --link: #fdd835;
    --prev: #5c6bc0;
    --next: #26a69a;
    --contents: #ff7043;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  header, footer {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: rgba(0, 0, 0, 0.25);
  }
  header { justify-content: space-between; }
  #deck-title {
    font-size: 0.9em;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* "X of N" page number, pinned lower right; sits above the contents modal so it shows there too */
  #page-number {
    position: fixed;
    right: 16px;
    bottom: 12px;
    z-index: 11;
    font-size: 0.9em;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    white-space: nowrap;
    pointer-events: none;
  }
  #progress { flex: none; height: 3px; background: rgba(255, 255, 255, 0.08); }
  #progress-bar { height: 100%; width: 0; background: var(--h1); transition: width 0.2s ease; }

  main {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 8px;
    padding: 12px 12px 8px;
  }
  #slide-scroll {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 22px 28px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }
  .side-nav {
    flex: none;
    width: 44px;
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--muted);
    font-size: 1.5em;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .side-nav:hover:not(:disabled) { background: rgba(255, 255, 255, 0.14); color: #fff; }
  .side-nav:disabled { opacity: 0.15; cursor: not-allowed; }

  /* Slide typography */
  #slide { max-width: 1200px; margin: 0 auto; font-size: clamp(15px, 1.5vw, 21px); }
  #slide::after { content: ""; display: block; clear: both; }
  #slide h1 { font-size: 2.1em; color: var(--h1); border-bottom: 2px solid var(--h1); padding-bottom: 4px; margin-bottom: 0.5em; }
  #slide h2 { font-size: 1.7em; color: var(--h2); margin-bottom: 0.5em; }
  #slide h3 { font-size: 1.25em; color: #fff; margin: 0.9em 0 0.5em; }
  #slide p { line-height: 1.7; margin-bottom: 0.8em; }
  #slide ul, #slide ol { line-height: 1.7; margin: 0.6em 0 0.8em 1.6em; }
  #slide li { margin-bottom: 0.3em; }
  #slide a { color: var(--link); }
  #slide strong { color: #fff; }
  #slide img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 16px auto; }
  #slide img[align="right"] { float: right; margin: 4px 0 16px 24px; }
  #slide img[align="left"] { float: left; margin: 4px 24px 16px 0; }
  #slide iframe { display: block; width: 100%; min-height: 300px; border: none; border-radius: 8px; margin: 12px 0; background: #fff; }
  #slide code { background: rgba(0, 0, 0, 0.35); padding: 1px 6px; border-radius: 4px; font-family: 'Fira Code', Consolas, monospace; font-size: 0.9em; }
  #slide pre { background: rgba(0, 0, 0, 0.35); padding: 14px; border-radius: 8px; overflow-x: auto; margin: 0.8em 0; }
  #slide pre code { background: none; padding: 0; }
  #slide blockquote { border-left: 3px solid var(--h1); padding-left: 14px; color: #cfd8dc; margin: 0.8em 0; }
  #slide table { border-collapse: collapse; margin: 0.8em 0; }
  #slide th, #slide td { border: 1px solid var(--panel-border); padding: 6px 12px; text-align: left; }

  footer { justify-content: center; }
  .btn {
    padding: 9px 22px;
    font-size: 0.85em;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
  }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn.prev { background: var(--prev); }
  .btn.next { background: var(--next); }
  .btn.contents { background: var(--contents); }
  .btn.ghost { background: rgba(255, 255, 255, 0.12); padding: 6px 12px; }
  .btn:hover:not(:disabled) { filter: brightness(1.15); }
  .btn:focus-visible, .side-nav:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

  #contents-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(0, 0, 0, 0.85);
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #contents-modal.open { display: flex; }
  #contents-panel {
    width: 100%;
    max-width: 640px;
    max-height: 85vh;
    overflow-y: auto;
    background: var(--panel);
    border-radius: 12px;
    padding: 24px;
  }
  #contents-panel h2 { color: var(--h1); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--panel-border); }
  .toc-item { display: flex; gap: 12px; width: 100%; padding: 10px 12px; margin-bottom: 4px; background: none; border: none; border-left: 3px solid transparent; border-radius: 6px; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .toc-item:hover { background: rgba(100, 181, 246, 0.2); }
  .toc-item.current { background: rgba(100, 181, 246, 0.3); border-left-color: var(--h1); }
  .toc-num { flex: none; min-width: 28px; color: var(--h1); font-weight: 600; }

  .message { text-align: center; padding: 48px 16px; color: var(--muted); }
  .message.error { color: #ef5350; }
  .message code { background: rgba(0, 0, 0, 0.35); padding: 1px 6px; border-radius: 4px; }

  @media (max-width: 640px) {
    .side-nav { display: none; }
    #slide-scroll { padding: 16px; }
    .btn { padding: 9px 14px; }
  }
</style>
</head>
<body>
<header>
  <span id="deck-title">Slide Viewer</span>
  <button class="btn ghost" id="fs-btn" title="Fullscreen (F)">&#x26F6;</button>
</header>
<div id="progress"><div id="progress-bar"></div></div>
<main>
  <button class="side-nav" id="side-prev" title="Previous slide (Left Arrow)" aria-label="Previous slide">&#9664;</button>
  <div id="slide-scroll"><div id="slide"><div class="message">Loading slides&hellip;</div></div></div>
  <button class="side-nav" id="side-next" title="Next slide (Right Arrow)" aria-label="Next slide">&#9654;</button>
</main>
<footer>
  <button class="btn prev" id="prev">Prev</button>
  <button class="btn contents" id="contents-btn">Contents</button>
  <button class="btn next" id="next">Next</button>
</footer>
<div id="page-number" aria-live="polite"></div>
<div id="contents-modal" role="dialog" aria-label="Table of contents">
  <div id="contents-panel"><h2>Contents</h2><div id="contents-items"></div></div>
</div>

<script>
(function () {
  'use strict';

  var slides = [];          // [{ title, markdown }]
  var current = 0;
  var deckUrl = null;       // absolute URL of the markdown file; base for relative links
  var $ = function (id) { return document.getElementById(id); };

  // ---------- loading ----------

  function showMessage(html, isError) {
    $('slide').innerHTML = '<div class="message' + (isError ? ' error' : '') + '">' + html + '</div>';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Only same-origin decks are allowed: the markdown is rendered as HTML, so a
  // crafted ?input=https://elsewhere/... link must never be able to inject it.
  function resolveDeckUrl() {
    var input = new URLSearchParams(location.search).get('input');
    if (!input) return null;
    var url = new URL(input, location.href);
    return url.origin === location.origin ? url : false;
  }

  function parseFrontmatter(text) {
    var m = text.match(/^---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/);
    if (!m) return { meta: {}, body: text };
    var meta = {};
    var t = m[1].match(/^title:\s*(.+)$/m);
    if (t) meta.title = t[1].trim().replace(/^["']|["']$/g, '');
    return { meta: meta, body: text.slice(m[0].length) };
  }

  // Split on `---` lines that are not inside a ``` / ~~~ code fence.
  function splitOnRules(body) {
    var chunks = [], buf = [], fence = null;
    body.split(/\r?\n/).forEach(function (line) {
      var f = line.match(/^\s*(```+|~~~+)/);
      if (f) {
        if (!fence) fence = f[1][0];
        else if (f[1][0] === fence) fence = null;
      }
      if (!fence && /^---[ \t]*$/.test(line)) { chunks.push(buf.join('\n')); buf = []; }
      else buf.push(line);
    });
    chunks.push(buf.join('\n'));
    return chunks;
  }

  // Fallback for decks without `---` separators: one slide per `## ` heading.
  function splitOnHeadings(body) {
    var chunks = [], buf = [], fence = null;
    body.split(/\r?\n/).forEach(function (line) {
      var f = line.match(/^\s*(```+|~~~+)/);
      if (f) {
        if (!fence) fence = f[1][0];
        else if (f[1][0] === fence) fence = null;
      }
      if (!fence && /^## /.test(line) && buf.length) { chunks.push(buf.join('\n')); buf = []; }
      buf.push(line);
    });
    chunks.push(buf.join('\n'));
    return chunks;
  }

  function parseDeck(text) {
    var fm = parseFrontmatter(text);
    var chunks = splitOnRules(fm.body);
    if (chunks.filter(function (c) { return c.trim(); }).length < 2) chunks = splitOnHeadings(fm.body);
    var out = [];
    chunks.forEach(function (chunk) {
      if (!chunk.trim()) return;
      var h = chunk.match(/^#{1,3}\s+(.+?)\s*#*\s*$/m);
      out.push({ title: h ? h[1].replace(/[*_`]/g, '') : 'Slide ' + (out.length + 1), markdown: chunk });
    });
    return { title: fm.meta.title || (out[0] && out[0].title) || 'Slides', slides: out };
  }

  // ---------- rendering ----------

  // MkDocs-style attribute lists on images: ![alt](src){ width="300px" align="right" }
  function expandImageAttrs(md) {
    return md.replace(/!\[([^\]]*)\]\(([^)\s]+)\)\{:?\s*([^}]*?)\s*\}/g, function (_m, alt, src, attrs) {
      var extra = '';
      attrs.replace(/([\w-]+)="([^"]*)"/g, function (_a, k, v) {
        extra += ' ' + k + '="' + escapeHtml(v) + '"';
      });
      return '<img src="' + escapeHtml(src) + '" alt="' + escapeHtml(alt) + '"' + extra + '>';
    });
  }

  // Resolve relative URLs against the markdown file's location (the same base
  // MkDocs uses when it renders that file as a page).
  function fixUrls(root) {
    root.querySelectorAll('[src], [href]').forEach(function (el) {
      ['src', 'href'].forEach(function (attr) {
        var v = el.getAttribute(attr);
        if (!v || v.charAt(0) === '#') return;
        try { el.setAttribute(attr, new URL(v, deckUrl).href); } catch (e) { /* leave as is */ }
      });
    });
    root.querySelectorAll('a[href]').forEach(function (a) {
      var same = new URL(a.href).origin === location.origin;
      a.target = same ? '_top' : '_blank';
      a.rel = 'noopener';
    });
  }

  // Tear down the previous slide's iframes explicitly so running sims stop
  // (and release memory) before the next slide's sims start.
  function unloadSlide() {
    $('slide').querySelectorAll('iframe').forEach(function (f) {
      f.src = 'about:blank';
      f.remove();
    });
  }

  function render() {
    unloadSlide();
    var tpl = document.createElement('template');   // inert: nothing loads until inserted
    tpl.innerHTML = marked.parse(expandImageAttrs(slides[current].markdown));
    fixUrls(tpl.content);
    $('slide').replaceChildren(tpl.content);
    $('slide-scroll').scrollTop = 0;

    var last = slides.length - 1;
    $('page-number').textContent = (current + 1) + ' of ' + slides.length;
    $('progress-bar').style.width = (last ? (current / last) * 100 : 100) + '%';
    ['prev', 'side-prev'].forEach(function (id) { $(id).disabled = current === 0; });
    ['next', 'side-next'].forEach(function (id) { $(id).disabled = current === last; });
    history.replaceState(null, '', '#slide-' + (current + 1));
  }

  function go(n) {
    n = Math.max(0, Math.min(slides.length - 1, n));
    if (n === current && $('slide').children.length) return;
    current = n;
    render();
  }

  // ---------- contents ----------

  function showContents() {
    var box = $('contents-items');
    box.replaceChildren();
    slides.forEach(function (s, i) {
      var b = document.createElement('button');
      b.className = 'toc-item' + (i === current ? ' current' : '');
      var num = document.createElement('span');
      num.className = 'toc-num';
      num.textContent = i + 1;
      var label = document.createElement('span');
      label.textContent = s.title;
      b.append(num, label);
      b.addEventListener('click', function () { hideContents(); go(i); });
      box.appendChild(b);
    });
    $('contents-modal').classList.add('open');
    var cur = box.querySelector('.current');
    if (cur) cur.scrollIntoView({ block: 'center' });
  }
  function hideContents() { $('contents-modal').classList.remove('open'); }
  function contentsOpen() { return $('contents-modal').classList.contains('open'); }

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  // ---------- wiring ----------

  ['prev', 'side-prev'].forEach(function (id) { $(id).addEventListener('click', function () { go(current - 1); }); });
  ['next', 'side-next'].forEach(function (id) { $(id).addEventListener('click', function () { go(current + 1); }); });
  $('contents-btn').addEventListener('click', showContents);
  $('fs-btn').addEventListener('click', toggleFullscreen);
  $('contents-modal').addEventListener('click', function (e) { if (e.target === this) hideContents(); });

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || !slides.length) return;
    switch (e.key) {
      case 'ArrowRight': case 'PageDown': case ' ':
        if (contentsOpen()) return;
        e.preventDefault(); go(current + 1); break;
      case 'ArrowLeft': case 'PageUp':
        if (contentsOpen()) return;
        e.preventDefault(); go(current - 1); break;
      case 'Home': e.preventDefault(); go(0); break;
      case 'End': e.preventDefault(); go(slides.length - 1); break;
      case 'c': case 'C': contentsOpen() ? hideContents() : showContents(); break;
      case 'f': case 'F': toggleFullscreen(); break;
      case 'Escape': hideContents(); break;
    }
  });

  window.addEventListener('hashchange', function () {
    var m = location.hash.match(/^#slide-(\d+)$/);
    if (m && slides.length) go(parseInt(m[1], 10) - 1);
  });

  async function init() {
    var url = resolveDeckUrl();
    if (url === null) {
      showMessage('<h2>No deck specified</h2><p>Add a markdown path relative to the <code>slides/</code> folder:</p>' +
        '<p><code>slide-viewer.html?input=overview-microsims/slides.md</code></p>');
      return;
    }
    if (url === false) {
      showMessage('<h2>Deck must be on this site</h2><p>Only same-origin markdown files can be shown.</p>', true);
      return;
    }
    deckUrl = url.href;
    try {
      var res = await fetch(deckUrl);
      if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
      var deck = parseDeck(await res.text());
      if (!deck.slides.length) throw new Error('No slides found in the file');
      slides = deck.slides;
      $('deck-title').textContent = deck.title;
      document.title = deck.title + ' – Slides';
      var m = location.hash.match(/^#slide-(\d+)$/);
      current = m ? Math.max(0, Math.min(slides.length - 1, parseInt(m[1], 10) - 1)) : 0;
      render();
    } catch (err) {
      showMessage('<h2>Error loading slides</h2><p>Fetching <code>' + escapeHtml(deckUrl) + '</code></p><p>' +
        escapeHtml(err.message) + '</p>', true);
    }
  }
  init();
})();
</script>
</body>
</html>
