# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'AI for EE Research'
site_description: 'An interactive intelligent textbook for researchers in electrical engineering and computer design. A hands-on guide with practical demonstrations of how AI tools and agents can support everyday research tasks, such as literature searches, data analysis, brainstorming, coding, and manuscript preparation.'
site_author: 'Dan McCreary'
site_url: 'https://dmccreary.github.io/ai-for-ee-research/'

# Hooks — runs local Python before/after page processing.
# `plugins/social_override.py` injects og:title, og:description, og:image,
# og:type, og:url, and twitter:* meta tags on every page using each page's
# frontmatter `title:` / `description:` / `image:` (falling back to the site-
# wide values and `img/cover.png`). This is the Cairo-free path to social-
# media previews — works without `pip install "mkdocs-material[imaging]"`.
# If the `social` plugin below is ever enabled, the same hook also rewrites
# its auto-generated `/assets/images/social/...` URLs to point at the
# declared cover image. Verify the result with `bk-check-social-cover`.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/dmccreary/ai-for-ee-research'
edit_uri: 'blob/main/docs'

# Copyright
copyright: 'Copyright &copy; 2026 Dan McCreary. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - About: about.md
  - Course Description: course-description.md

  - Chapters:
      - List of Chapters: chapters/index.md
      - 1. Research Workflows and the Researcher as Orchestrator: chapters/01-research-workflows-orchestrator/index.md
      - 2. How Language Models Work: chapters/02-how-language-models-work/index.md
      - 3. Choosing Models and Writing Clear Prompts: chapters/03-models-and-prompt-basics/index.md
      - 4. Context Engineering and Advanced Prompting: chapters/04-context-engineering-prompting/index.md
      - 5. Markdown Project Files and Version Control: chapters/05-markdown-and-version-control/index.md
      - 6. Knowledge Bases, Personal Knowledge Graphs, and the Anatomy of an Agent Skill: chapters/06-knowledge-bases-skill-anatomy/index.md
      - 7. Designing, Testing, and Sharing Agent Skills: chapters/07-designing-testing-skills/index.md
      - 8. Agents, Tool Use, and Subagents: chapters/08-agents-tool-use-subagents/index.md
      - 9. Supervising Agents and Defining Agent Roles: chapters/09-supervising-agents-roles/index.md
      - 10. Orchestrating Teams of Planning and Execution Agents: chapters/10-orchestrating-agent-teams/index.md
      - 11. AI-Assisted Literature Search and Synthesis: chapters/11-literature-search-synthesis/index.md
      - 12. AI-Assisted Data Analysis and Scripting: chapters/12-data-analysis-scripting/index.md
      - 13. Simulation, Testing, and Reproducible Code: chapters/13-simulation-testing-code/index.md
      - 14. Brainstorming and Problem Framing: chapters/14-brainstorming-problem-framing/index.md
      - 15. AI-Assisted Manuscript Preparation: chapters/15-manuscript-preparation/index.md
      - 16. MicroSims and Research Communication: chapters/16-microsims-communication/index.md
      - 17. Verification and Reproducibility: chapters/17-verification-reproducibility/index.md
      - 18. Responsible and Ethical Use of AI: chapters/18-responsible-ethical-use/index.md
      - 19. Always-On Personal Agents for Research: chapters/19-always-on-personal-agents/index.md
      - 20. Case Studies and Capstone Project: chapters/20-case-studies-capstone/index.md

  - Learning Graph:
      - Introduction: learning-graph/index.md
      # Generated by learning-graph-generator skill:
      - Course Description Assessment: learning-graph/course-description-assessment.md
      - Concept Enumeration: learning-graph/concept-list.md
      - Concept Taxonomy: learning-graph/concept-taxonomy.md
      - Graph Quality Analysis: learning-graph/quality-metrics.md
      - Taxonomy Distribution: learning-graph/taxonomy-distribution.md
      - Mascot Rendering Test: learning-graph/mascot-test.md

  - MicroSims:
      - List of MicroSims: sims/index.md

  - Appendices:
      - Personal Agents: appendices/personal-agents/index.md

  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  # logo: img/logo.png
  # favicon: img/favicon.ico
  palette:
    # University of Minnesota brand colors (Maroon #7A0019, Gold #FFCC33).
    # Material has no named maroon/gold, so these are 'custom' and the actual
    # values live in docs/css/extra.css.
    primary: 'custom'
    accent: 'custom'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Currency-safe math: inline is \(...\) only, never single $. Run
  # book-installer feature 5 (KaTeX) to add the renderer.
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: ['round']
      block_syntax: ['dollar', 'square']

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css
  - css/mascot.css

# Custom JavaScript — uncomment once a corresponding file exists
# extra_javascript:
#   - js/extra.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md
  **/seed-prompt.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | implemented | instrumented | approved
  # `instrumented` = the sim carries xAPI event handling (main.html loads lrs-sim.js and
  # the code calls LRSSim.create); the add-xapi-events-to-microsim skill's
  # scripts/sync-status.py sets it. Its icon is always the teal "signal" (MDI access-point).
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    implemented: Implemented — the MicroSim works
    instrumented: Instrumented — the MicroSim emits xAPI events; add ?xapi=teaching to the URL to see them
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'AI for EE Research'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
